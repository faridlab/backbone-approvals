server:
  host: 0.0.0.0
  port: 8080
  grpc_port: 50051
database:
  url: postgresql://root:password@localhost:5432/skeletondb
  max_connections: 10
  min_connections: 5
  connect_timeout: 30
  idle_timeout: 600
logging:
  level: info
  format: json
  file: logs/approvals.log
module:
  name: approvals
  enabled: true
features:
  soft_delete: true
  state_machines: false
  workflows: true
entities:
  approval_policy:
    collection: approval_policies
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  approval_request:
    collection: approval_requests
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  approval_step:
    collection: approval_steps
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  approval_step_template:
    collection: approval_step_templates
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
  delegation:
    collection: delegations
    enabled: true
    cache_ttl: 300
    pagination:
      default_limit: 20
      max_limit: 100
tracing:
  enabled: true
  exporter: otlp
  endpoint: http://localhost:4317
metrics:
  enabled: true
  endpoint: /metrics
  port: 9090
