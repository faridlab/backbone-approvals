# =============================================================================
# Domain: approvals
# Entity: ApprovalPolicy
# Description: An approval policy per resource type — defines the ordered chain
#              of approval steps a workflow module must walk to get a decision.
#              Owns the ApprovalResourceType enum (reused by ApprovalRequest).
# =============================================================================

models:
  # Tenancy: none, by design (ADR-0029). Tenant-agnostic and reusable; a composing
  # service's tenancy decorator owns org scoping for this table, including the
  # org-scoped per-resource name unique and the one-active-policy-per-resource rule
  # that keep one policy family per unit.
  - name: ApprovalPolicy
    collection: approval_policies
    description: "Approval policy per resource type — defines the chain of approval steps."

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]

      resource_type:
        type: ApprovalResourceType
        attributes: ["@required"]
        description: "promotion/onboarding/offboarding/clearance/leave/timesheet/offer/appraisal/custom"

      name:
        type: string
        attributes: ["@required", "@length(max=120)"]
        description: "Human label for this policy"

      status:
        type: ApprovalPolicyStatus
        attributes: ["@default(active)"]
        description: "Only active policies are matched for new requests"

      description:
        type: string?
        attributes: ["@length(max=255)"]
        description: "Optional long-form description"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata"

enums:
  - name: ApprovalPolicyStatus
    description: "Lifecycle of an approval policy"
    variants:
      - name: active
        description: "Eligible for matching new requests"
        default: true
      - name: inactive
        description: "Retired; existing requests keep running to verdict"

  - name: ApprovalResourceType
    description: "The workflow entity kind an approval gates."
    variants:
      - name: promotion
      - name: onboarding
      - name: onboarding_task
      - name: offboarding
      - name: clearance
      - name: leave
      - name: timesheet
      - name: offer
      - name: appraisal
      - name: custom
        default: true
      - name: expense

  - name: ApprovalPriority
    description: "Priority of an approval request (drives SLA / escalation)."
    variants:
      - name: low
      - name: normal
        default: true
      - name: high
      - name: urgent
