components:
  schemas:
    ApprovalPolicy:
      type: object
      required:
        - id
        - company_id
        - resource_type
        - name
        - is_active
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        description:
          nullable: true
          type: string
        metadata:
          type: object

    ApprovalPolicyBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalPolicy'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateApprovalPolicyRequest:
      type: object
      required:
        - company_id
        - resource_type
        - name
        - is_active
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        description:
          nullable: true
          type: string
        metadata:
          type: object

    UpdateApprovalPolicyRequest:
      type: object
      required:
        - company_id
        - resource_type
        - name
        - is_active
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        description:
          nullable: true
          type: string
        metadata:
          type: object

    PatchApprovalPolicyRequest:
      type: object
      properties:
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        name:
          type: string
        is_active:
          type: boolean
        description:
          nullable: true
          type: string
        metadata:
          type: object

    ApprovalPolicyList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalPolicy'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ApprovalRequest:
      type: object
      required:
        - id
        - company_id
        - resource_type
        - resource_id
        - requested_by
        - status
        - priority
        - metadata
      properties:
        id:
          type: string
          format: uuid
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        resource_id:
          type: string
          format: uuid
        policy_id:
          nullable: true
          type: string
          format: uuid
        requested_by:
          type: string
          format: uuid
        status:
          type: string
        current_step:
          nullable: true
          type: integer
          format: int32
        priority:
          type: string
        submitted_at:
          nullable: true
          type: string
          format: date-time
        decided_at:
          nullable: true
          type: string
          format: date-time
        decided_by:
          nullable: true
          type: string
          format: uuid
        summary:
          nullable: true
          type: object
        metadata:
          type: object

    ApprovalRequestBulkResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequest'
        total: { type: integer }
        failed: { type: integer }
        errors:
          type: array
          items: { type: string }

    CreateApprovalRequestRequest:
      type: object
      required:
        - company_id
        - resource_type
        - resource_id
        - requested_by
        - status
        - priority
        - metadata
      properties:
        company_id:
          type: string
          format: uuid
        resource_type:
          type: string
        resource_id:
